name: Deploy Pages

# Static site, no build step -- just publish the repo root to GitHub Pages on
# every push to main. The download button links straight to the installer on
# Yandex Object Storage (callifornia-download bucket, uploaded by CalliforniaApp's release
# workflow), so nothing here needs to know about CalliforniaApp releases.
#
# The repo root includes CNAME, which is what binds the deployment to the
# custom domain callifornia.online. Publishing the root wholesale is what keeps
# it there -- drop the file and the next deploy hands the site back to
# frontmany.github.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
