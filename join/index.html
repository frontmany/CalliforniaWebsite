<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a call — Calls</title>
  <meta name="description" content="Open this call in the Calls desktop app." />
  <link rel="icon" href="../assets/favicon.ico" />

  <!-- Link previews: this page exists to be pasted into chats, so it should
       render as a card rather than a bare URL. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Join a call on Calls" />
  <meta property="og:description" content="Click to open this call in the Calls desktop app." />
  <meta property="og:image" content="../assets/logo.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("calls-theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="../index.html">
        <img src="../assets/logo.png" alt="" class="brand-logo" width="28" height="28" />
        <span>Calls</span>
      </a>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero container container--narrow join-page">
      <img src="../assets/logo.png" alt="Calls" class="hero-logo" width="80" height="80" />

      <!-- Valid invite -->
      <div id="join-valid" hidden>
        <h1>Join the call</h1>
        <p class="hero-sub">
          Click below to open this call in the Calls desktop app.
        </p>

        <div class="join-actions">
          <a id="open-btn" class="btn-primary" href="#">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="M15 16l5-4-5-4"/><path d="M9 12h11"/>
            </svg>
            Open in Calls
          </a>
        </div>
      </div>

      <!-- No usable id in the URL -->
      <div id="join-invalid" hidden>
        <h1>This link looks broken</h1>
        <p class="hero-sub">
          It doesn&rsquo;t contain a call ID. Ask whoever sent it for a new
          link, or open Calls and enter the call ID by hand.
        </p>
        <div class="cta-desktop">
          <a class="btn-primary" href="../index.html">Go to the Calls home page</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <span>&copy; <span id="year">2026</span> Calls</span>
      <nav class="footer-links" aria-label="Footer">
        <a href="../changelog.html">Changelog</a>
        <a href="../privacy.html">Privacy</a>
        <a href="mailto:fmtab2014@gmail.com">Contact</a>
      </nav>
    </div>
  </footer>

  <script>
    (function () {
      "use strict";

      // Must match isPlausibleId() in CallsApp/src/core/session/meeting_link.cpp.
      // The id comes out of the URL, i.e. from whoever wrote the link, so it is
      // validated before being used anywhere. It only ever ends up in the
      // calls:// href below (via setAttribute) -- never innerHTML, never
      // concatenated into markup.
      var ID_PATTERN = /^[a-z0-9-]{1,64}$/;

      function readMeetingId() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        if (!id) {
          // Tolerate /join/<id> for hand-written links. GitHub Pages serves
          // this page for /join/ only, so the query form above is canonical.
          var parts = window.location.pathname.split("/").filter(Boolean);
          var last = parts[parts.length - 1];
          if (last && last !== "join" && last !== "index.html") id = last;
        }
        if (!id) return null;
        id = String(id).trim().toLowerCase();
        return ID_PATTERN.test(id) ? id : null;
      }

      var meetingId = readMeetingId();
      var valid = document.getElementById("join-valid");
      var invalid = document.getElementById("join-invalid");

      if (!meetingId) {
        invalid.hidden = false;
        return;
      }

      var deepLink = "calls://join/" + meetingId;
      document.getElementById("open-btn").setAttribute("href", deepLink);
      valid.hidden = false;

      // Try to hand off immediately. Browsers increasingly want a user gesture
      // for protocol handlers, and there is no reliable way to detect whether
      // the handler exists -- hence the button above, which stays visible
      // (and is the only recovery path) either way.
      window.setTimeout(function () {
        window.location.href = deepLink;
      }, 400);
    })();
  </script>
  <script src="../assets/main.js"></script>
</body>
</html>
